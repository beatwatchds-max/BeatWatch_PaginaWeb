name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-security-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Security policy tests
        run: npm run test:security

      - name: Build
        env:
          VITE_API_URL: https://ci.invalid.example
          VITE_FREE_LICENSE_METHOD: Gratuito
        run: npm run build

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: beatwatch-sbom
          path: sbom.cdx.json
